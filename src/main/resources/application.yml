spring:
  application:
    name: ticketing
  datasource:
    url: jdbc:postgresql://localhost:5432/ticketing
    username: ticketing
    password: ticketing
    hikari:
      maximum-pool-size: 30
      connection-init-sql: SET lock_timeout = 5000   # fail a lock wait after 5s (milliseconds)
  jpa:
    open-in-view: false            # no lazy loading from views; services return what the page needs
    hibernate:
      ddl-auto: none               # schema is owned by Flyway (db/migration)
  flyway:
    enabled: true
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2s
  thymeleaf:
    cache: false

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info

ticketing:
  currency: USD
  zone: UTC               # zone used for event wall-clock times and all timestamps
  seed: true              # create a couple of demo events on an empty database
  hold:
    ttl: 5m               # how long a seat hold lasts
    max-seats: 8          # per hold
    expiry-grace: 5s      # reaper waits this long past expiry before marking a hold EXPIRED
  jobs:
    lock-ttl: 30s         # distributed lock lifetime for scheduled jobs
    hold-expiry-interval-ms: 10000
