<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title} + ' | Box Office'">Box Office</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header class="topbar" th:fragment="nav">
  <a class="brand" th:href="@{/}">Box Office</a>
  <nav>
    <a th:href="@{/}">Events</a>
    <a th:href="@{/admin/events}">Manage events</a>
  </nav>
</header>
<div th:fragment="flash">
  <p class="flash error" role="alert" th:if="${error}" th:text="${error}"></p>
  <p class="flash success" role="status" th:if="${success}" th:text="${success}"></p>
</div>
</body>
</html>
